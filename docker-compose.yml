# SQL Server 2022 for the data pipeline.
# Start:  docker compose up -d        Stop:  docker compose down
# The password is read from your .env file (MSSQL_SA_PASSWORD).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64            # runs on Apple Silicon through Rosetta
    container_name: sql2022
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql   # keeps your database between restarts
volumes:
  sqlserver-data: